<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Forecast</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #d0ebff 0%, #e5dbff 50%, #c3fae8 100%);
      min-height: 100vh;
      color: #2b235a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      margin: 0;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 28px;
      border: 2.5px solid rgba(255, 255, 255, 0.95);
      padding: 32px 28px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 16px 36px rgba(132, 94, 247, 0.2);
    }

    .section-badge {
      display: inline-block;
      background: linear-gradient(135deg, #845ef7, #5c7cfa, #38d9a9);
      color: #ffffff;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .section-heading {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: #3b2d71;
    }

    .form-control {
      border-radius: 15px;
      border: 2px solid rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.92);
      padding: 11px 15px;
      font-weight: 600;
      color: #2b235a;
    }

    .form-control:focus {
      background: #ffffff;
      border-color: #9775fa;
      box-shadow: 0 0 0 0.22rem rgba(151, 117, 250, 0.25);
    }

    .btn-whimsy {
      background: linear-gradient(135deg, #748ffc 0%, #b197fc 50%, #63e6be 100%);
      color: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.95);
      border-radius: 18px;
      padding: 12px 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 18px rgba(132, 94, 247, 0.28);
    }

    .btn-whimsy:hover {
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(132, 94, 247, 0.36);
    }

    .result-box {
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #d0bfff;
      border-radius: 20px;
      padding: 18px;
      margin-top: 20px;
      color: #2b235a;
    }
  </style>
</head>
<body>

  <main class="glass-card">
    <span class="section-badge">ICT 10 Skills Test</span>
    <h1 class="h3 section-heading mb-1">Weather Instruments Forecast⋆｡°•☁︎</h1>
    <p class="text-muted small mb-4">
      Enter a weather instrument name (Thermometer, Barometer, Anemometer, Hygrometer, Rain Gauge, Wind Vane, Weather Balloon, or Pyranometer).
    </p>

    <div class="mb-3">
      <label for="instrument_input" class="form-label fw-bold">Weather Instrument Name:</label>
      <input type="text" id="instrument_input" class="form-control" placeholder="e.g. Thermometer">
    </div>

    <button type="button" id="search_btn" class="btn btn-whimsy w-100" py-click="search_instrument">
      Search Instrument
    </button>

    <div id="instrument_output" class="result-box small">
      <p class="mb-1"><strong>Weather Instrument Name:</strong> -</p>
      <p class="mb-1"><strong>What It Measures:</strong> -</p>
      <p class="mb-1"><strong>Unit of Measurement:</strong> -</p>
      <p class="mb-0"><strong>Purpose:</strong> -</p>
    </div>
  </main>
  
  <script type="py" src="main.py"></script>
</body>
</html>
